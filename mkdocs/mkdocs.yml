site_name: Macroni Documentation
repo_url: https://github.com/srschreiber/macroni
repo_name: srschreiber/macroni

nav:
  - Home: index.md
  - Language Syntax: syntax.md
  - Function Reference: functions.md
  - Grammar Specification: grammar.md
  - Examples:
    - Click Button: example_click_button.md
    - Automated Login: example_automated_login.md
    - Random Clicks: example_random_clicks.md
    - Pixel Monitor: example_pixel_monitor.md
    - Interactive Setup: example_interactive_setup.md
    - Record & Replay: example_record_replay.md
    - Drift Net Crafting: jutecraftingexample.md

theme:
  name: material
  custom_dir: overrides
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html
